<h1>질문 목록</h1>

<a href="{% url 'board:question_create' %}">
  <button>질문 등록</button>
</a>

<ul>
  {% for question in question_list %}
    <li>
      <a href="{% url 'board:question_detail' question.id %}">
        {{ question.title }}
      </a>
    </li>
  {% empty %}
    <li>질문이 없습니다.</li>
  {% endfor %}
</ul>
